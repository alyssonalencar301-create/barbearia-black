<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda — Barbearia Black</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-mark">BB</div>

            <div>
                <strong>BARBEARIA BLACK</strong>
                <span>PAINEL DO PROPRIETÁRIO</span>
            </div>
        </div>

        <button
            type="button"
            id="logoutAdmin"
            class="secondary-btn"
        >
            Sair da Agenda
        </button>

    </header>


    <!-- =========================
         ÁREA PRINCIPAL
    ========================== -->
    <main>

        <section class="booking-section">

            <div class="section-heading">
                <p class="eyebrow">PAINEL</p>

                <h1 style="font-size: clamp(38px, 6vw, 64px);">
                    Agenda da Barbearia
                </h1>

                <p class="hero-text">
                    Consulte e gerencie os agendamentos realizados pelos clientes.
                </p>
            </div>


            <!-- =========================
                 AGENDA
            ========================== -->
            <div class="booking-card admin-box">

                <div class="admin-date">

                    <label for="adminDate">
                        Escolha a data
                    </label>

                    <input
                        type="date"
                        id="adminDate"
                    >

                </div>


                <!-- Lista dos agendamentos -->
                <div
                    id="adminList"
                    class="admin-list"
                >
                    <p style="color: #a5a5a5;">
                        Carregando agenda...
                    </p>
                </div>


                <!-- Excluir todos -->
                <button
                    type="button"
                    id="clearAll"
                    class="secondary-btn"
                >
                    Excluir todos os agendamentos
                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->
    <footer>
        Barbearia Black — Painel administrativo
    </footer>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!--
        Por enquanto vamos criar o admin.js
        no próximo passo.
    -->
    <script src="admin.js"></script>

</body>
</html>
